[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nvtexpy"
# dynamic = ["version"]
version = "1.0.0"
authors = [
  { name="Lukas Vögtle", email="lvoegtle@nvidia.com" },
  { name="Philipp Fischer", email="pfischer@nvidia.com" },
]
description = "Python package to use in the nvpdftex pipeline with nvtexlive"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "pyyaml",
  "click",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "ruff",
]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[project.scripts]
nvpdflatex = "nvtexpy.tools.convert_single_document:main"
structured-pkl-convert = "nvtexpy.tools.convert_structured_pkl:cli"

[project.urls]
Homepage = "https://github.com/NVIDIA/nvtexpy"

[tool.hatch.build.targets.wheel]
packages = ["src/nvtexpy"]

[tool.hatch.build.targets.sdist]
packages = ["src/nvtexpy"]

[tool.ruff]
line-length = 100
